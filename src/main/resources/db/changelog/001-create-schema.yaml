databaseChangeLog:
  - changeSet:
      id: 1
      author: humanit
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    increment: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: tax_identifier
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(30)
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    increment: true
              - column:
                  name: number
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: expiration_date
                  type: DATE
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
            foreignKeys:
              - foreignKey:
                  columnNames: client_id
                  referencedTableName: clients
                  referencedColumnNames: id
                  onDelete: CASCADE