spring:
  datasource:
    url: jdbc:h2:mem:clientapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
h2:
  console:
    enabled: true
    path: /h2-console
server:
  port: 8080
app:
  jwt:
    secret: "$(openssl rand -base64 48)"
    expiration-minutes: 60
springdoc:
  swagger-ui:
    path: /swagger-ui.html